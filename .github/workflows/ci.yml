name: G-Archive Nexus CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality-check:
    name: Type Check, Lint and Build

    runs-on: ubuntu-latest

    timeout-minutes: 10

    env:
      NEXT_PUBLIC_SITE_URL: https://g-archive-nexus.vercel.app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: ESLint check
        run: npm run lint

      - name: Production build
        run: npm run build
